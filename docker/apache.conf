ServerTokens Prod
ServerSignature Off
Header always set X-Content-Type-Options "nosniff"
<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
    <FilesMatch "^(conf|router)\.php$">
        Require all denied
    </FilesMatch>
</Directory>
<Directory /var/www/html/includes>
    Require all denied
</Directory>
<DirectoryMatch "^/var/www/html/(images|perfiles)$">
    php_admin_flag engine off
    <FilesMatch "\.(php[0-9]?|phtml|phar|htaccess)$">
        Require all denied
    </FilesMatch>
</DirectoryMatch>

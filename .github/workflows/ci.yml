name: PHP CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    name: PHP checks (${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: PHP eta Composer prestatu
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml, xmlwriter, mysqli
          coverage: none
          tools: composer:v2
      - name: Mendekotasunak instalatu
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Composer konfigurazioa egiaztatu
        run: composer validate --strict
      - name: PHP sintaxia egiaztatu
        run: composer lint
      - name: Analisi estatikoa
        if: ${{ !cancelled() }}
        run: composer analyse
      - name: Unitate-probak
        if: ${{ !cancelled() }}
        run: composer test -- --log-junit build/junit.xml
      - name: Proben emaitzak gorde
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: php-tests-${{ matrix.php }}
          path: build/junit.xml
          if-no-files-found: warn

  security-http:
    name: HTTP security and Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Web eta MySQL isolatuak abiatu
        run: docker compose --env-file .env.test.example -p arrue-security-ci up -d --build --wait --wait-timeout 180 web
      - name: Benetako HTTP segurtasun-probak
        run: docker compose --env-file .env.test.example -p arrue-security-ci --profile test run --build --rm tests
      - name: HTTP ebidentziak gorde
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: security-http
          path: build/security-http.json
          if-no-files-found: warn
      - name: Diagnostikoa
        if: failure()
        run: docker compose --env-file .env.test.example -p arrue-security-ci logs --tail 80
      - name: Proba-ingurunea gelditu
        if: ${{ always() }}
        run: docker compose --env-file .env.test.example -p arrue-security-ci down
